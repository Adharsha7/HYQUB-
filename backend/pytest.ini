[pytest]
# HYQUB test configuration
#
# Markers:
#   integration  — requires live Anvil (chain_id 31337) and/or
#                  live backend HTTP server.  Run separately with:
#                    pytest -m integration -q
#
# Unit tests (no marker) run without any external services:
#   pytest -m "not integration" -q

markers =
    integration: requires live Anvil chain and/or running backend

# Always add short test summary for failures
addopts = -ra

# Discover tests in the tests/ directory
testpaths = tests
