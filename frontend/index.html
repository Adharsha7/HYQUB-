<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYQUB</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Small additions on top of styles.css. Existing classes are reused. */
    body { display: block; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px 48px; }
    .wrap .card { margin-bottom: 14px; }
    .wrap h1 { font-size: 20px; margin: 8px 0 16px; }
    .wrap input { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .link-btn { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
    .pick { display: block; width: 100%; text-align: left; margin-top: 6px; }
    .hist-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .hist-item:last-child { border-bottom: 0; }
    .hist-item summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
    .hist-item .hash { word-break: break-all; font-size: 12px; margin-top: 6px; opacity: .7; }
    .muted { opacity: .7; font-size: 13px; }
    .ok { color: #3ecf8e; } .bad { color: #ff6b6b; }
    /* Bug fix: styles.css input rule omits type=password; ensure password fields match text inputs */
    input[type=password] {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: inherit;
      font-size: 14px; padding: 10px 14px; outline: none; transition: border-color .15s;
    }
    input[type=password]:focus { border-color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Login / Sign up -->
  <section id="screen-auth">
    <h1>HYQUB</h1>
    <div class="card">
      <div id="auth-title" style="font-weight:600;margin-bottom:12px">Log in</div>
      <div id="auth-error" class="field-error" role="alert"></div>
      <form id="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="auth-username">Username</label>
          <input id="auth-username" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="auth-password">Password</label>
          <input id="auth-password" type="password" autocomplete="current-password" required>
        </div>
        <button id="auth-submit" type="submit" class="btn btn-primary btn-full">Log in</button>
      </form>
      <p class="muted" style="margin-top:12px">
        <span id="auth-toggle-text">New here?</span>
        <button id="auth-toggle" type="button" class="link-btn">Create an account</button>
      </p>
      <p id="auth-hint" class="muted" hidden>Setting up your account can take up to 20 seconds.</p>
    </div>
  </section>

  <!-- Home -->
  <section id="screen-home" hidden>
    <div class="row">
      <h1 id="home-greeting">Hi</h1>
      <button id="btn-logout" class="btn btn-secondary btn-sm">Log out</button>
    </div>
    <div class="balance-hero">
      <div class="balance-label">Available balance</div>
      <div><span class="balance-amount" id="home-balance">0</span> <span class="balance-unit">ETH</span></div>
      <div class="balance-actions">
        <button id="btn-go-pay" class="btn btn-primary">Send money</button>
        <button id="btn-refresh" class="btn btn-secondary">Refresh</button>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">Recent activity</div>
      <div id="home-empty" class="muted">No payments yet. Send your first one.</div>
      <div id="home-history"></div>
    </div>
  </section>

  <!-- Pay -->
  <section id="screen-pay" hidden>
    <div class="row">
      <h1>Send money</h1>
      <button id="btn-pay-back" class="btn btn-secondary btn-sm">Back</button>
    </div>
    <div class="card">
      <div id="pay-error" class="field-error" role="alert"></div>
      <form id="pay-form" autocomplete="off">
        <div class="form-group">
          <label for="pay-search">Send to</label>
          <input id="pay-search" type="text" placeholder="Search by name" autocomplete="off">
          <div id="pay-results"></div>
          <div id="pay-selected" class="muted" style="margin-top:6px"></div>
        </div>
        <div class="form-group">
          <label for="pay-amount">Amount</label>
          <div class="input-suffix">
            <input id="pay-amount" type="text" inputmode="decimal" placeholder="0.01" autocomplete="off">
            <span class="input-suffix-label">ETH</span>
          </div>
          <div class="muted" style="margin-top:4px">Up to 0.5 ETH per payment and 1 ETH per day.</div>
        </div>
        <div class="form-group">
          <label for="pay-password">Confirm with your password</label>
          <input id="pay-password" type="password" autocomplete="current-password">
        </div>
        <button id="pay-submit" type="submit" class="btn btn-primary btn-full">Send</button>
      </form>
    </div>
  </section>

  <!-- Status / result -->
  <section id="screen-status" hidden>
    <div class="card" style="text-align:center">
      <div id="status-title" style="font-weight:600;font-size:18px;margin:8px 0"></div>
      <div id="status-sub" class="muted" style="margin-bottom:16px"></div>
      <button id="status-done" class="btn btn-primary" hidden>Done</button>
      <button id="status-retry" class="btn btn-secondary" hidden>Try again</button>
    </div>
  </section>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
